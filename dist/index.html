<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAAL Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* One calm violet world. Layout idea: airy single column, big type, one action per block. */
:root{--grad:linear-gradient(100deg,#EEE7FD 0%,#F7ECF4 55%,#FDEEE5 100%);--ink:#2A2735;--mute:#6E6879;--cream:#FAF7F2;--violet:#6B55C9;--lav:#C9ADF0;--lav2:#EEE7FD;--green:#1F5C48;--green2:#E3F2EA;--green3:#58B86E;--peach2:#FDEEE5;--blue2:#E6F0FA;--yellow2:#FBF1CF;--line:#ECE5DC;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;color-scheme:light}
body{background:var(--cream);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8E78E6;outline-offset:2px}
#shell{display:flex;min-height:100%}
#side{flex:none;width:240px;background:#fff;padding:32px 18px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;height:100dvh}
.logo{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;color:var(--green);letter-spacing:-.5px;padding:0 8px 26px;background:none;border:0}
.tabbtn{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:16px;font-size:15px;font-weight:600;color:#6E6879;background:none;border:0;text-align:left;width:100%}
.tabbtn.on{color:var(--green);background:var(--lav2)}
.tabbtn:hover{background:#F6F1FF}
#main{flex:1;min-width:0;padding:72px 56px 160px}
#app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:64px}
.t1{font-size:44px;font-weight:700;letter-spacing:-1.6px;line-height:1.06;text-wrap:balance}
.t2{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.lead{font-size:17px;line-height:1.6;color:var(--mute)}
.small{font-size:13px;line-height:1.45;color:var(--mute)}
.label{font-size:12.5px;font-weight:600;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:20px}
.hd{display:flex;flex-direction:column;gap:12px}
.soft{background:#fff;border-radius:28px;padding:24px 26px}
.item{display:flex;gap:16px;align-items:center;background:#fff;border-radius:24px;padding:18px 22px;width:100%;text-align:left;border:0}
.item.btnlike:hover{background:#FBF9FF}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 30px;border-radius:28px;background:var(--green);color:#fff;font-weight:600;font-size:16px;border:0;align-self:flex-start}
.btn.v{background:var(--violet)}
.btn.w{background:#fff;color:var(--ink)}
.btn.soft2{background:var(--lav2);color:var(--ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{height:42px;padding:0 20px;font-size:14px;border-radius:21px}
.btn.full{align-self:stretch;width:100%}
.btn:active{transform:scale(.98)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:14px;background:#fff;border:1.5px solid #E7DEF8;color:var(--ink);text-decoration:none}
.chip.act{background:var(--lav2);border-color:transparent;color:var(--violet)}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.sugg::-webkit-scrollbar{display:none}.sugg .chip{flex:none}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--lav2);color:#5A3FA6}
.tag.ok{background:var(--green2);color:var(--green)}
.tog{flex:none;width:48px;height:30px;border-radius:15px;background:#DDD6CE;position:relative;border:0;margin-left:auto}
.tog:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.tog.on{background:var(--green)}.tog.on:after{left:21px}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #D6CFC6;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:13px;font-weight:800}
.check.on{background:var(--green3);border-color:var(--green3)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:11px 20px;font-size:14px;font-weight:700;color:var(--ink);border-radius:22px;border:0;background:#fff;transition:transform .12s,background .15s}
.seg button:nth-child(4n+1){background:var(--lav2)}.seg button:nth-child(4n+2){background:var(--peach2)}.seg button:nth-child(4n+3){background:var(--green2)}.seg button:nth-child(4n+4){background:var(--blue2)}
.seg button:active{transform:scale(.96)}
.seg button.on{background:var(--violet)!important;color:#fff;box-shadow:0 4px 0 #4E3BA3}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;border:2px solid var(--lav);border-radius:18px;padding:14px 16px;background:#fff;outline:none;font-size:16px}
textarea{resize:none}
.back{flex:none;width:48px;height:48px;border-radius:50%;background:#fff;border:0;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;box-shadow:0 2px 10px rgba(42,39,53,.10)}
.back:active{transform:scale(.94)}
.hero{position:relative;overflow:hidden;background:var(--violet);border-radius:44px;color:#fff;padding:56px 44px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#fff;border-radius:18px;padding:12px 0 10px;text-align:center;border:2px solid transparent}
.day.sel{border-color:var(--ink)}
.day .dd{font-size:18px;font-weight:700}
.day .bar{height:6px;border-radius:3px;margin:8px 14px 0}
.dn{text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.opt{position:relative;background:#fff;border-radius:22px;padding:18px 22px;overflow:hidden;width:100%;text-align:left;border:0;font-size:16px;font-weight:600}
.opt.sel{background:#F6F1FF;outline:2px solid #B79BEB;outline-offset:-2px}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:#DCD0FB;opacity:.7;transition:width .8s}
.opt .in{position:relative;display:flex;justify-content:space-between;gap:12px}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:var(--ink);color:#fff;border-radius:18px;padding:14px 22px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.bob,.fade{animation:none}}
#tabs-m{display:none}
@media (max-width:959px){
 #side{display:none}
 #main{padding:64px 20px 150px}
 #app{gap:48px}
 .t1{font-size:34px}
 .hero{padding:40px 26px;border-radius:36px}
 #tabs-m{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
 #tabs-m .tabbtn{flex-direction:column;gap:2px;font-size:11px;width:auto;padding:10px 16px;border-radius:18px}
 #tabs-m .tabbtn svg{width:30px;height:30px}
 #tabs-m .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .toast{bottom:100px}
}
#va-m{display:none}
@media (max-width:959px){
 #va-m{display:block;position:fixed;top:14px;right:14px;z-index:55}
 #va-m button{display:flex;align-items:center;gap:6px;background:#fff;border:0;border-radius:20px;padding:5px 12px 5px 6px;font-size:12px;font-weight:700;box-shadow:0 2px 10px rgba(42,39,53,.10)}
}
.mic{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--lav2);color:var(--violet);display:inline-flex;align-items:center;justify-content:center}
.mic.on{background:var(--violet);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(107,85,201,.45)}50%{box-shadow:0 0 0 10px rgba(107,85,201,0)}}
</style>
</head>

const act=id=>ACTS[id];
const TYPE_WORDS={alone:'Alone, no prep',together:'Together',screen:'Screen with a purpose'};
const STAGE_WORDS={peak:'At the peak',down:'Coming down',calm:'Calm again'};
function pickActs(scen){
 const pool=SCEN[scen].pool.slice();const ps=S.pstate||'busy';const fit=prof().relaunch;
 const score=id=>{const a=act(id);let sc=0;if(ps==='busy'&&a.type==='alone')sc+=3;if(ps==='low'&&a.min<=2)sc+=3;if(ps==='low'&&a.type!=='together')sc+=1;if(ps==='free'&&a.type==='together')sc+=3;if(a.fit.includes(fit))sc+=2;if(a.type==='screen')sc-=0.5;return sc};
 pool.sort((a,b)=>score(b)-score(a));return pool.slice(0,3)}

/* moment */
const SCEN={
 tablet:{sum:'Crying for the tablet · dinner · you can\'t stop cooking',you:"You're not failing. Hungry, tired, end of day: this is the hardest hour for everyone. You don't have to fix the evening. Just the next step.",say:'"You really wanted the tablet. It\'s hard to stop. I\'m cooking for ten minutes, and I have something for you."',steps:['Say it once, then wait','Offer one idea below','Keep cooking, back in 5'],pool:['shape','water','playdough','squeeze','breathe','getmad','count','pillowfort'],planb:'Squeeze a pillow together, then flop.'},
 handover:{sum:'Crying before leaving for Dad\'s · Sunday evening',you:"This is not about you, and not about Marc. Switching homes is hard work for a 5-year-old, even when both homes are good. The tears are the switch, not a verdict.",say:'"It\'s hard to say goodbye. Tonight you\'re at Dad\'s, and I pick you up Friday at school. Bun comes with you."',steps:['Say the plan, same words','Short, warm goodbye','One line to the other home'],pool:['ritual','bag','note','breathe','madsong','count'],planb:'If he keeps crying in the car: "You can be sad and still go. I\'ll call you at 7."'},
 bedtime:{sum:'Won\'t stay in bed · 9 pm · you have work left',you:"Nine o'clock with work still waiting is a lot. He isn't testing you, he's wound up. Low lights and a boring routine beat negotiating.",say:'"It\'s bedtime. I\'ll check on you in five minutes. Nothing fun is happening out here."',steps:['Say it once, flat and kind','Lights down, same order','Back exactly when you said'],pool:['check','boring','bun','belly','breathe'],planb:'If he gets up a third time: walk him back without a word. No talk, no light.'}};
V.m1=()=>{const tile=(on,bg,m,t,click)=>`<button onclick="${click}" aria-pressed="${on}" style="flex:1;min-width:0;border:0;border-radius:24px;padding:14px 6px 12px;background:${bg};display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;line-height:1.2;outline:${on?'3px solid #2A2735':'none'};outline-offset:-3px">${mon(m,38)}<span>${t}</span></button>`;
 const keep="S.mtext=val('mtext');save();render()";
 return `<div class="fade stack" style="gap:26px">${BACK('today','Today')}
<div style="display:flex;gap:12px;align-items:center">${mon('ghost',48,'class="bob"')}<h1 class="t1" style="font-size:30px">What's happening?</h1></div>
<div style="position:relative"><textarea id="mtext" rows="2" placeholder="Tell paal, or tap the mic" style="padding:18px 80px 18px 20px;border-radius:26px;font-size:17px">${S.mtext||''}</textarea><div style="position:absolute;right:10px;top:50%;transform:translateY(-50%)">${micBtn('mtext')}</div></div>
<div style="display:flex;gap:10px">${[['tablet','Tablet tears','blue','var(--blue2)'],['handover',"Before Dad's",'orange','var(--peach2)'],['bedtime','Won\'t sleep','sleepy','var(--lav2)']].map(([k,t,m,bg])=>tile(S.scen===k,bg,m,t,`S.scen=S.scen==='${k}'?null:'${k}';${keep}`)).join('')}</div>
<div style="display:flex;gap:8px;align-items:center"><span class="t2" style="font-size:17px;flex:none">And you?</span>${[['busy',"Busy",'yellow'],['low','Tired','sleepy'],['free','Can play','green']].map(([k,t,m])=>`<button onclick="S.pstate='${k}';${keep}" aria-pressed="${S.pstate===k}" style="flex:1;min-width:0;border:0;border-radius:18px;padding:8px 4px;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;gap:4px;background:${S.pstate===k?'var(--ink)':'#fff'};color:${S.pstate===k?'#fff':'var(--ink)'}">${mon(m,20)}${t}</button>`).join('')}</div>
<button class="btn v full" style="height:60px;font-size:17px" onclick="startMoment()">${mon(kid().mon,30)}Help me with ${kid().name} →</button></div>`};

function startMoment(){S.mtext=val('mtext');if(!S.scen)S.scen=/bed|sleep/i.test(S.mtext)?'bedtime':/dad|mom|leav|goodbye|marc/i.test(S.mtext)?'handover':'tablet';save();go('m2');setTimeout(()=>{if(S.screen==='m2')go('m3')},1200)}
V.m2=()=>`<div class="fade" style="text-align:center;padding-top:140px;display:flex;flex-direction:column;align-items:center;gap:18px">${mon('ghost',120,'')}</div>`.replace('<svg','<svg class="bob"');
const PST={busy:"you're busy, so these start with what Léo can do alone",low:'you said low energy, so these cost you almost nothing',free:'you can play, so these are things to do together'};
V.m3=()=>{const s=SCEN[S.scen||'tablet'];const ids=pickActs(S.scen||'tablet');const first=act(ids[0]);const why=first.fit.includes(prof().relaunch)?` <b>${first.t}</b> first, because ${kid().name} ${PROF_WORDS.relaunch[prof().relaunch]}.`:'';return `<div class="fade stack" style="gap:48px">${BACK('m1','Change the moment')}<div style="background:linear-gradient(180deg,#FDEEE5 0%,#FBF1CF 100%);border-radius:36px;padding:34px 24px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;overflow:hidden;position:relative">
<div style="position:relative;width:170px;height:170px;display:flex;align-items:center;justify-content:center"><div style="position:absolute;inset:0;border-radius:50%;background:#F9D9C2"></div><div style="position:absolute;left:-22px;right:-22px;bottom:6px;height:34px;border-radius:50%;border:3px solid #F6C9A9;opacity:.7"></div><div style="position:relative">${mon('sleepy',110,'class="bob"')}</div></div>
<h1 class="t1" style="font-size:32px;color:#3C3650">First, you.</h1><p style="font-size:17px;line-height:1.55;font-weight:500;color:#5A5468;max-width:340px">${s.you}</p></div>
${SEC('Words you could say',`<div class="soft" style="background:#fff;padding:26px 26px 26px;position:relative"><div aria-hidden="true" style="font-size:64px;line-height:.6;font-weight:700;color:#F6A979;height:30px">“</div><p style="font-size:20px;line-height:1.45;font-weight:600;letter-spacing:-.3px;color:#3C3650">${s.say.replace(/^"|"$/g,'')}</p></div>${stepFlow(s.steps)}`)}
${SEC('Then try one',`<div class="stack">${ids.map(id=>actCard(id)).join('')}</div><div class="btnrow">${BTN('See all ideas for this moment',"go('toolkit',{tkStage:'"+(S.scen==='bedtime'?'calm':S.scen==='handover'?'calm':'down')+"'})",'sm soft2')}</div>`,'Ordered because '+PST[S.pstate||'busy']+'.'+why)}</div>`};


/* one button for the study: reference, limits and link only on tap */
function studyBtn(src,limits,url){const open=S.studyOpen;return `<div class="stack" style="gap:10px"><button class="chip" style="align-self:flex-start;padding:10px 16px;font-size:14px" aria-expanded="${!!open}" onclick="set({studyOpen:!S.studyOpen})">${mon('green',20)}The study ${open?'▴':'▾'}</button>${open?`<div class="soft stack" style="gap:8px;padding:18px 20px"><b style="font-size:15px">${src}</b>${limits?`<p class="small" style="font-size:14px">${limits}</p>`:''}${url?`<a class="chip act" style="align-self:flex-start" href="${url}" target="_blank" rel="noopener">Read it ↗</a>`:''}</div>`:''}</div>`}

 say:'<path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v6a2.5 2.5 0 0 1-2.5 2.5H11l-4 3.5V15H7.5A2.5 2.5 0 0 1 5 12.5Z" fill="#fff" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 9.5h6M9 12h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 offer:'<rect x="4" y="9" width="16" height="11" rx="2.5" fill="#fff" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M12 9v11M12 9c-1.5-3.5-5.5-4-5.5-1.5S12 9 12 9Zm0 0c1.5-3.5 5.5-4 5.5-1.5S12 9 12 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',

 star:'<path d="M12 4l2.3 4.8 5.2.7-3.8 3.6.9 5.2L12 15.8 7.4 18.3l.9-5.2-3.8-3.6 5.2-.7Z" fill="#fff" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'};
function stepIcon(t){t=t.toLowerCase();return /say|tell|name|ask|words/.test(t)?'say':/offer|give|option|pick|hand/.test(t)?'offer':/wait|back|minute|five|cook|later|stay/.test(t)?'wait':/hug|kiss|cuddle|goodbye|love/.test(t)?'hug':'star'}
function stepShort(t){return t}
function stepFlow(steps){const C=[['#FDE3D2','#E98A5B'],['#DDF1E5','#3E9A6A'],['#E1ECFA','#4C86CC'],['#FBEFC6','#C79A1F']];
 return `<div class="stack" style="gap:16px"><div style="display:flex;gap:6px">${steps.map((_,i)=>`<div style="flex:1;height:12px;border-radius:6px;background:${C[i%4][1]};opacity:.85"></div>`).join('')}</div><div class="stack" style="gap:14px">${steps.map((t,i)=>`<div style="display:flex;gap:16px;align-items:center"><div style="flex:none;width:56px;height:56px;border-radius:18px;background:${C[i%4][0]};color:${C[i%4][1]};display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">${STEP_IC[stepIcon(t)]}</svg></div><div style="font-size:17px;font-weight:600;line-height:1.3">${t}</div></div>`).join('')}</div></div>`}
function actCard(id,compact){const a=act(id);return `<button class="item btnlike" style="background:${a.bg}" onclick="go('m4',{opt:'${id}'})">${mon(a.m,50)}<div class="grow"><div style="font-size:18px;font-weight:600">${a.t}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="tag" style="background:#fff">${TYPE_WORDS[a.type]}</span><span class="tag" style="background:#fff">${a.min?a.min+' min':'0 prep'}</span>${a.tool?'<span class="tag">Opens in paal</span>':a.link?'<span class="tag">Free video</span>':''}</div></div><span class="mute">›</span></button>`}
V.m4=()=>{const s=SCEN[S.scen||'tablet'],a=act(typeof S.opt==='string'?S.opt:'shape');return `<div class="fade stack" style="gap:40px">${BACK(S.from||'m3',S.from==='toolkit'?'All ideas':'Options')}<div style="display:flex;gap:18px;align-items:center">${mon(a.m,72)}<h1 class="t1" style="font-size:34px">${a.t}</h1></div>
<div class="stack" style="gap:12px">${a.steps.map((t,i)=>`<div class="soft" style="display:flex;gap:14px;align-items:center;padding:16px 20px"><span style="flex:none;width:30px;height:30px;border-radius:50%;background:${['#B9A3EA','#EFA98A','#C9B26A'][i%3]};color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center">${i+1}</span><p style="line-height:1.5">${t}</p></div>`).join('')}</div>
<div class="soft" style="background:var(--green2)"><div class="label" style="color:var(--green)">Why it works</div><p style="margin-top:6px;line-height:1.55">${a.why}</p><p class="small" style="margin-top:8px">${a.src}</p>${s&&S.from!=='toolkit'?`<div style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1px dashed #BFDCCB">${mon('blue',24)}<p style="font-size:14px;line-height:1.5"><b>If it doesn't work:</b> ${s.planb}</p></div>`:''}</div>
${a.link?`<a class="item" href="${a.link[1]}" target="_blank" rel="noopener" style="background:var(--blue2)"><span style="flex:none;width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px">▶</span><div class="grow"><b>${a.link[0]}</b></div><span class="mute">↗</span></a>`:''}
<div class="item"><div class="grow"><b>Share with ${isCarer()?'the parents':ON()}</b><div class="small">${isCarer()?'So they know what worked here':'So it works at the other home too'}</div></div>${TOG(S.share!==false,"set({share:S.share===false})",'Share')}</div>
<div class="btnrow">${a.tool?BTN('Open it with '+kid().name+' →',"go('tool',{tool:'"+a.tool+"'})",'v'):BTN("Start. We'll check in after →","go('m5')",'v')}${BTN('Add to '+kid().name+"'s playbook",`addPlay('${typeof S.opt==='string'?S.opt:'shape'}')`,'soft2')}</div></div>`};
function addPlay(id){const k=kid();if(!k.next.some(n=>n[0]===act(id).t))k.next.unshift([act(id).t,'Saved from the toolkit']);save();toast('Added to '+k.name+"'s playbook")}
V.m5=()=>{const o=[act(typeof S.opt==='string'?S.opt:'shape').t];return `<div class="fade stack" style="gap:36px;text-align:center;align-items:center;padding-top:40px">${mon(kid().mon,100,'')}<h1 class="t1">Ten minutes later.<br>Did it help?</h1><p class="lead">${o[0]} · ${kid().name}</p><div class="btnrow" style="justify-content:center">${BTN('It worked',"logMoment(true)",'')}${BTN('Not this time',"logMoment(false)",'ghost')}</div></div>`.replace('<svg','<svg class="bob"')};
function logMoment(ok){const o=[act(typeof S.opt==='string'?S.opt:'shape').t];const k=kid();(ok?k.works:k.didnt).unshift([o[0],ok?'Today · worked':'Today · not this time']);S.moments.unshift({t:o[0],ok,by:S.me});S.scen=null;S.mtext='';S.from=null;save();go('today');toast(ok?`Saved to ${k.name}'s profile${S.share!==false?' · shared with '+(isCarer()?'the parents':ON()):''}`:'Noted. paal will suggest something else next time.')}

V.tool=()=>{clearTimer();const t=S.tool;const done=()=>`<div class="btnrow" style="justify-content:center">${BTN('Done. Did it help? →',"go('m5')",'v')}${BTN('Again',"render()",'ghost')}</div>`;
 if(t==='breathe'){setTimeout(startBreathe,50);return `<div class="fade stack" style="gap:28px;align-items:center;text-align:center;padding-top:20px"><h1 class="t1" style="font-size:34px">Smell the flower.<br>Blow the candle.</h1><p class="lead" id="bcount">Four breaths. Ready?</p><div style="position:relative;width:260px;height:260px;display:flex;align-items:center;justify-content:center"><div id="bcircle" style="width:120px;height:120px;border-radius:50%;background:var(--lav);transition:width 4s ease-in-out,height 4s ease-in-out,background 4s"></div><div style="position:absolute">${mon(kid().mon,70)}</div></div><p id="bword" style="font-size:28px;font-weight:600;min-height:40px"></p><div id="bdone" style="display:none">${done()}</div></div>`}
 if(t==='squeeze'){setTimeout(startSqueeze,50);return `<div class="fade stack" style="gap:28px;align-items:center;text-align:center;padding-top:20px"><h1 class="t1" style="font-size:34px">Squeeze… and flop!</h1><p class="lead" id="sround">Three rounds. Grab a pillow.</p><div id="sbox" style="width:240px;height:240px;border-radius:48px;background:var(--yellow2);display:flex;align-items:center;justify-content:center;transition:transform .4s,background .4s">${mon('green',110)}</div><p id="sword" style="font-size:34px;font-weight:700;min-height:44px"></p><div id="sdone" style="display:none">${done()}</div></div>`}
 if(t==='color'){const c=S.feelColor,sh=S.feelShape;const cols=[['#F06A6A','red'],['#F6A979','orange'],['#F7D774','yellow'],['#9ED7B4','green'],['#A9CBEF','blue'],['#C9ADF0','purple'],['#8A8A8A','grey'],['#2A2735','black']];const shapes=[['storm','A storm'],['scribble','A scribble'],['wave','A big wave'],['ball','A tight ball'],['fire','Fire'],['rain','Rain']];
  return `<div class="fade stack" style="gap:32px;align-items:center;text-align:center;padding-top:10px"><h1 class="t1" style="font-size:34px">${!c?'What color is the feeling?':!sh?'And what shape is it?':'There it is.'}</h1><div style="width:220px;height:220px;border-radius:50%;background:${c||'#EEE7FD'};display:flex;align-items:center;justify-content:center;transition:background .4s">${mon(kid().mon,120)}</div>${!c?`<div style="display:grid;grid-template-columns:repeat(4,64px);gap:14px">${cols.map(([h,n])=>`<button aria-label="${n}" onclick="set({feelColor:'${h}'})" style="width:64px;height:64px;border-radius:50%;background:${h};border:4px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.12)"></button>`).join('')}</div>`:!sh?`<div class="btnrow" style="justify-content:center">${shapes.map(([k,v])=>`<button class="chip" style="font-size:16px;padding:12px 18px" onclick="set({feelShape:'${v}'})">${v}</button>`).join('')}</div>`:`<p style="font-size:22px;font-weight:600;max-width:420px">${sh}, in that color. Now draw it on paper, as big as you want.</p>${done()}<button class="chip" onclick="set({feelColor:null,feelShape:null})">Start over</button>`}</div>`}
 if(t==='story'){const lines=['First you woke up.','Then you had breakfast. Slowly.','Then you put on your shoes.','Then the car. Then school.','Then lunch. Then the afternoon.','Then home. Then dinner.','Then bath. Then this bed.','And now the day is over.'];const i=S.storyI||0;

let authMode='in',authMsg='',authBusy=false;
V.auth=()=>`<div class="fade stack" style="gap:24px;max-width:440px;margin:0 auto;width:100%;padding-top:20px">
<div style="display:flex;justify-content:center">${mon('ghost',96,'class="bob"')}</div>
<h1 class="t1" style="font-size:32px;text-align:center">${authMode==='up'?'Create your account':authMode==='reset'?'Reset your password':'Welcome back'}</h1>
<div class="stack" style="gap:12px">${authMode==='up'?'<input type="text" id="au-name" placeholder="Your first name" autocomplete="given-name">':''}
<input type="email" id="au-email" placeholder="Email" autocomplete="email">
${authMode==='reset'?'':`<input type="password" id="au-pass" placeholder="Password" autocomplete="${authMode==='up'?'new-password':'current-password'}">`}
${authMsg?`<p class="small" style="font-size:14px;color:var(--ink)">${authMsg}</p>`:''}
<button class="btn v full" ${authBusy?'disabled':''} onclick="authGo()">${authBusy?'…':authMode==='up'?'Create account':authMode==='reset'?'Send reset link':'Sign in'}</button></div>
<div class="btnrow" style="justify-content:center">${authMode!=='in'?`<button class="chip" onclick="authMode='in';authMsg='';render()">I have an account</button>`:`<button class="chip" onclick="authMode='up';authMsg='';render()">Create an account</button><button class="chip" onclick="authMode='reset';authMsg='';render()">Forgot password</button>`}</div>
<button class="btn ghost full" onclick="set({guest:true})">Continue without an account</button></div>`;
async function authGo(){if(!SB||authBusy)return;const email=val('au-email'),pass=(document.getElementById('au-pass')||{}).value||'';if(!email){authMsg='Add your email first.';render();return}
 authBusy=true;authMsg='';render();try{
  if(authMode==='up'){const {data,error}=await SB.auth.signUp({email,password:pass,options:{data:{name:val('au-name')},emailRedirectTo:location.origin}});if(error)throw error;authMsg=data.session?'':'Check your email to confirm your account.';if(data.session)S.account=email}
  else if(authMode==='reset'){const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(error)throw error;authMsg='If an account exists for that email, a reset link is on its way.'}
  else{const {error}=await SB.auth.signInWithPassword({email,password:pass});if(error)throw error;S.account=email}

:"build","title":"Build tonight’s routine","hint":"Tap the calm steps. About 3–4 steps, 20–30 minutes in all.","items":[{"t":"🛁 Bath","ok":true},{"t":"👕 Pajamas","ok":true},{"t":"📖 A book","ok":true},{"t":"🤗 A cuddle","ok":true},{"t":"📺 One more show","why":"Screens should be off at least an hour before bed."},{"t":"🤸 Wrestling","why":"Too wound up. Keep the last 30 minutes calm and the lights dim."}],"doneText":"That’s a bedtime routine: calm, short, and the same every night."},{"type":"flip","myth":"“Kids just fall asleep when they’re tired.”","truth":"Tired isn’t enough. A predictable routine helps the body wind down, and it works through repetition, so give it two to three weeks."},{"type":"pledge","title":"Pick one thing to try tonight","options":["Pick one bedtime and keep it the same, even on weekends","Turn screens off an hour before bed","Say goodnight while they’re drowsy but still awake"]}],"screen-plan":[{"type":"meet","who":["aap","who"],"kicker":"Who recommends this?","text":"The American Academy of Pediatrics and the World Health Organization both recommend clear, consistent limits: about an hour a day of quality content for ages 2–5, planned ahead instead of negotiated every time."},{"type":"idea","icon":"🗓️","title":"Plan it before it starts","text":"Most screen fights happen at the ending. Agree on when, where and how long before the tablet comes out, so “no” never feels like a surprise."},{"type":"quiz","kicker":"What would you do?","q":"The tablet time is almost up, and your child is about to protest. What helps most?","options":[{"t":"Grab it and turn it off","why":"A sudden ending feels unfair, and it usually makes the protest bigger."},{"t":"Give a 5-minute and a 1-minute warning, then end it as agreed","ok":true,"why":"Yes. Warnings (or a visual timer) make the ending predictable."},{"t":"Give 10 extra minutes to avoid a fight","why":"It teaches that protesting moves the limit. Staying consistent gets easier with repetition."}]},{"type":"quiz","q":"Which one is a “when–then”?","options":[{"t":"“Turn it off right now or else!”","why":"That’s a threat. A when–then is calm and shows what comes next."},{"t":"“When the tablet is off, then we can go to the park.”","ok":true,"why":"Exactly. It points to something good that comes right after."},{"t":"“Maybe later, we’ll see.”","why":"Vague answers invite negotiating. Be specific."}]},{"type":"flip","myth":"“The goal is zero screens.”","truth":"It isn’t. Video calls with family and watching together are different from solo scrolling. Choose limits that fit your family, and model them yourself when you can."},{"type":"pledge","title":"Pick one thing to try this week","options":["Agree on the ending before it starts: “Two episodes, then off”","Use a visual timer or a 5-minute warning","Have the next activity ready to go"]}],"calm-tantrums":[{"type":"meet","who":["eyberg"],"kicker":"Who found this?","text":"Dr. Eyberg created Parent-Child Interaction Therapy (PCIT), one of the most studied approaches for tantrums and defiance in young children. Its core idea: lots of warm attention for calm behavior, very little for tantrum behavior that isn’t dangerous."},{"type":"idea","icon":"🔦","title":"Attention is a spotlight","text":"Children repeat what gets your attention. Shine the spotlight on calm moments, and keep it dim during the tantrum, as long as everyone is safe."},{"type":"quiz","kicker":"What would you do?","q":"Your child melts down in the store after hearing “no.” What comes first?","options":[{"t":"Keep everyone safe, then stay calm with few words","ok":true,"why":"Yes. Safety first, then something like “You’re really mad. I’m right here.”"},{"t":"Explain why they’re wrong, in detail","why":"Long lectures don’t reach a child in the middle of a meltdown."},{"t":"Offer a treat so it stops","why":"Bribing during a tantrum can teach that tantrums work."}]},{"type":"quiz","q":"The tantrum ends and your child calms down. What now?","options":[{"t":"Warm, specific :"flip","myth":"“Playtime should teach something.”","truth":"Following your child’s cues matters more than performing a particular play technique. Brief, relaxed time together counts."},{"type":"pledge","title":"Pick one thing to try today","options":["Describe what my child is doing for one minute","Copy what they do with a similar toy","Wait to see if they invite more"]}]},"COVERS":{"bedtime-routine":{"kind":"Study","study":"A nightly bedtime routine: impact on sleep in young children and maternal mood","by":"Dr. Jodi A. Mindell, Lauren S. Telofski, Benjamin Wiegand & Ethan S. Kurtz","short":"Dr. Jodi Mindell et al.","where":"Sleep (journal) · 2009","people":["mindell"]},"screen-plan":{"kind":"Guide","study":"Family Media Plan","by":"American Academy of Pediatrics","short":"American Academy of Pediatrics","where":"with World Health Organization screen-time guidance","people":["aap","who"]},"calm-tantrums":{"kind":"Therapy program","study":"Parent-Child Interaction Therapy (PCIT)","by":"Dr. Sheila Eyberg","short":"Dr. Sheila Eyberg","where":"University of Florida","people":["eyberg"]},"responsive-connection":{"kind":"Research","study":"Serve and Return","by":"Center on the Developing Child, Harvard University","short":"Harvard Center on the Developing Child","where":"Harvard University","people":["harvard"]},"listen-and-name":{"kind":"Guide","study":"Tips for Connecting and Communicating","by":"Centers for Disease Control and Prevention","short":"CDC","where":"U.S. public health agency","people":["cdc"]},"play-following":{"kind":"Guide","study":"Child-led Play","by":"Centers for Disease Control and Prevention","short":"CDC","where":"U.S. public health agency","people":["cdc"]}},"THEMES":[{"id":"sleep","icon":"😴","title":"Sleep & Routines","blurb":"Calmer nights, predictable evenings.","tone":"lav","lessons":["bedtime-routine"]},{"id":"screens","icon":"📱","title":"Screens","blurb":"Limits that don’t turn into battles.","tone":"sky","lessons":["screen-plan"]},{"id":"   else if (c.type === 'build') { const sel = ans[i] || [];
    body = `<div class="soft stack"><h2 class="t2">${c.title}</h2><p class="small">${c.hint}</p><div class="btnrow" style="margin-top:6px">${c.items.map((it, k) => `<button class="chip ${sel.includes(k) ? 'on' : ''}" onclick="dBuild(${i},${k})">${it.t}</button>`).join('')}</div>${sel.length >= 3 ? `<p style="line-height:1.5;margin-top:8px"><b>${c.doneText}</b></p>` : ''}</div>${sel.length >= 3 ? next() : ''}`; }
  else if (c.type === 'flip') { const on = ans[i];
    body = `<button class="soft" style="width:100%;text-align:left;border:0;background:${on ? 'var(--green2)' : '#fff'}" onclick="dAns(${i},1)"><div class="label">${on ? 'Actually' : 'People say'}</div><p style="font-size:19px;line-height:1.5;margin-top:10px;font-weight:${on ? 500 : 600}">${on ? c.truth : c.myth}</p>${on ? '' : '<p class="small" style="margin-top:12px">Tap to flip</p>'}</button>${on ? next() : ''}`; }
  else if (c.type === 'pledge') { const p = ans[i];
    body = `${SEC(c.title, `<div class="stack" style="gap:10px">${c.options.map((o, k) => `<button class="opt ${p === k ? 'sel' : ''}" onclick="dAns(${i},${k})"><div class="in"><span>${o}</span></div></button>`).join('')}</div>`, '')}
    ${p !== undefined ? BTN('Add to tonight →', `dPledge(${i})`, 'v') : ''}`; }
  return `<div class="fade stack" style="gap:28px">${BACK('learn', 'Learn')}<h1 class="t1" style="font-size:34px">${a.title}</h1>${dots}<div class="stack" style="gap:20px">${body}</div></div>`;
};
function dAns(i, k) { S.dans = S.dans || {}; S.dans[i] = k; save(); render(); }
function dBuild(i, k) { const c = AL.CARDS[S.deck][i], it = c.items[k]; if (!it.ok) { toast(it.why); return; } S.dans = S.dans || {}; const s = S.dans[i] || []; S.dans[i] = s.includes(k) ? s.filter(x => x !== k) : [...s, k]; save(); render(); }
function dPledge(i) { const c = AL.CARDS[S.deck][i], t = c.options[S.dans[i]]; const k = kid(); if (!k.next.some(n => n[0] === t)) k.next.unshift([t, 'From Learn · ' + AL.ACTIONS[S.deck].title]); S.lessonsDone[S.deck] = 1; save(); set({ di: (S.di || 0) + 1 }); toast('Added to ' + k.name + '’s “to try”'); }

/* ---------- Today: "Your learning" card (team's idea, paal's look) ---------- */
const ALL_LESSONS = () => [...Object.keys(AL.ACTIONS).map(id => ({ id, t: AL.ACTIONS[id].title, m: THEME_MON[(THEMES.find(th => th.lessons.includes(id)) || {}).id] || 'ghost', go: `go('deck',{deck:'${id}',di:0,dans:{}})` })), ...LESSONS.map(l => ({ id: l.id, t: l.t, m: l.m, go: `go('lesson',{lesson:'${l.id}',pick:null,li:0})` }))];
function learnRing(done, total) { const R = 44, C = 2 * Math.PI * R, seg = C / total, gap = 4; return `<svg viewBox="0 0 110 110" width="88" height="88" aria-hidden="true"><g transform="rotate(-90 55 55)">${[...Array(total)].map((_, i) => `<circle cx="55" cy="55" r="${R}" fill="none" stroke="${i < done ? 'var(--green3)' : '#ECE6DE'}" stroke-width="13" stroke-dasharray="${seg - gap} ${C - seg + gap}" stroke-dashoffset="${-i * seg}"/>`).join('')}</g><text x="55" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">${done}</text><text x="55" y="70" text-anchor="middle" font-size="11" fill="var(--mute)">of ${total}</text></svg>`; }
function learningCard() { const all = ALL_LESSONS(), done = all.filter(l => S.lessonsDone[l.id]).length, next = all.find(l => !S.lessonsDone[l.id]);
  const msg = done === 0 ? 'You haven’t started any lessons yet. The first one takes about 3 minutes.' : done < all.length ? `${done} done. Each one ends with one thing to try tonight.` : 'All done. Come back when a new one lands.';
  return `<div class="soft" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:20px 22px">${learnRing(done, all.length)}<div class="grow stack" style="gap:10px;min-width:180px"><h2 class="t2" style="font-size:20px">Your learning</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${all.map(l => `<button title="${l.t}" aria-label="${l.t}" onclick="${l.go}" style="width:20px;height:20px;border-radius:50%;border:2.5px solid ${COLORS[l.m] || COLORS.ghost};background:${S.lessonsDone[l.id] ? (COLORS[l.m] || COLORS.ghost) : '#fff'}"></button>`).join('')}</div>${next ? BTN('Next lesson', next.go, 'sm') : BTN('Review lessons', "go('learn')", 'sm ghost')}</div></div>`; }


/* ---------- voice: Web Speech API, with a demo fallback ---------- */
const MIC_SVG='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const MIC_DEMO={mtext:"Léo is screaming because I took the tablet and I have to finish dinner",chatq:"Bedtime is a fight every night"};
let rec=null;
function micBtn(target){return `<button type="button" class="mic" id="mic-${target}" aria-label="Speak instead of typing" onclick="listen('${target}')">${MIC_SVG}</button>`}
function listen(target){const el=document.getElementById(target),b=document.getElementById('mic-'+target);if(!el)return;
 if(rec){try{rec.stop()}catch(e){}rec=null;b&&b.classList.remove('on');return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const fake=()=>{b&&b.classList.add('on');const t=MIC_DEMO[target]||'';let i=0;el.value='';const iv=setInterval(()=>{el.value=t.slice(0,i+=3);if(i>=t.length){clearInterval(iv);el.value=t;b&&b.classList.remove('on');if(target==='chatq')paalSend()}},40)};
 if(!SR){fake();return}
 try{rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;
  rec.onresult=e=>{el.value=[...e.results].map(r=>r[0].transcript).join('')};
  rec.onerror=()=>{rec=null;fake()};
  rec.onend=()=>{rec=null;b&&b.classList.remove('on');if(target==='chatq'&&el.value.trim())paalSend()};
  b&&b.classList.add('on');rec.start()}catch(e){rec=null;fake()}}

/* ---------- 2. PAAL: chat + parent reset ---------- */
const RESET_STEPS = [
  ['Arrive', 18, 'Hi, I’m paal. Let’s take a few minutes, just for you. Sit or stand somewhere comfortable. You don’t need to do this perfectly.'],
  ['Notice', 25, 'Feel where your body touches the chair or the floor. Let your shoulders drop a little. Notice your breathing, without changing it.'],
  ['Cyclic sighing', 45, 'Breathe in through your nose, then one more short sip of air on top. Let it all out slowly through your mouth. Five times.'],
  ['Soften', 30, 'Let your breathing go back to normal. Unclench your jaw. Relax your hands. Let anything tight soften just a little.'],
  ['Be kind to yourself', 40, 'Hand on your chest if you like: “This is a hard moment. Hard moments are part of every parent’s life. May I be kind to myself right now.”'],
  ['Choose one thing', 25, 'Before you go back, pick one small intention. Maybe: I’ll take one breath before I respond. That’s enough.'],
  ['All done', 12, 'Well done. Come back anytime, even for one minute. Daily is where it adds up.']
];
const RESET_SRC = [['Cyclic sighing, Balban et al., Cell Reports Medicine, 2023', 'https://doi.org/10.1016/j.xcrm.2022.100895'], ['Self-compassion break, Kristin Neff', 'https://self-compassion.org/exercises/exercise-2-self-compassion-break/']];
const QUICK = [['Mirror faces', 0, 2, 'Make a surprised face, a silly face, a happy face, and let them copy you.'], ['Freeze dance', 2, 10, 'Hum a song and stop suddenly. Everyone freezes like a statue.'], ['I spy colors', 2, 12, '“I spy something… blue!” Take turns.'], ['Tape road', 2, 6, 'A road on the floor with painter’s tape, toy cars along it.'], ['Little kitchen helper', 2, 10, 'A real job: washing vegetables, stirring, setting out spoons.'], ['Water painting', 2, 8, 'A brush and a cup of water on the sidewalk. The art disappears as it dries.'], ['Pillow fort', 3, 10, 'Two chairs, a sheet, a flashlight. Rules of the fort decided by the child.'], ['Scavenger hunt', 4, 12, 'Five things to find: something soft, something red, something that makes noise…']];
const SAFETY = 'If someone is in immediate danger, has trouble breathing or is unresponsive, call local emergency services now (911 in the US). For possible abuse, contact child protective services or a healthcare professional. I’m a parenting companion, not an emergency service.';
const SAFETY_SRC = ['When to call EMS for your child (AAP)', 'https://www.healthychildren.org/english/health-issues/injuries-emergencies/pages/when-to-call-emergency-medical-services-ems.aspx'];

function paalAnswer(q) {
  const t = q.toLowerCase(), k = kid();
  const L = id => `<button class="chip act" onclick="go('lesson',{lesson:'${id}',pick:null,li:0})">Open the lesson ›</button>`, D = id => `<button class="chip act" onclick="go('deck',{deck:'${id}',di:0,dans:{}})">${AL.ACTIONS[id].title} ›</button>`, M = `<button class="chip act" onclick="go('m1')">Help me right now ›</button>`;
  if (/(unconscious|not breathing|breath|bleed|blood|hurt himself|hurt herself|abuse|hit him|hit her|danger|emergency|poison|swallow)/.test(t)) return { t: SAFETY, c: `<a class="chip act" href="${SAFETY_SRC[1]}" target="_blank" rel="noopener">${SAFETY_SRC[0]} ↗</a>` };
  if (/(limit|exhaust|tired|can't|cannot|cry|crying|lose it|losing it|burn|done with|overwhelm)/.test(t) && !/he |she |léo|leo|mia/.test(t)) return { t: 'That sounds like a lot, and it makes sense. Four minutes for you first, then ' + k.name + '. The breathing part comes from a Stanford trial where it lowered stress more than meditation did.', c: `<button class="chip on" onclick="go('reset')">Start the 4-minute reset ›</button>` };
  if (/(bed|sleep|night|asleep|wake)/.test(t)) return { t: 'Same three steps, same order, every night: bath, a quiet thing, lights out. In a trial with 405 families, children fell asleep faster within two weeks. Tonight, pick the steps and say them out loud before you start.', c: D('bedtime-routine') + L('sleep') };
  if (/(tablet|screen|tv|phone|ipad|cartoon|video|youtube)/.test(t)) return { t: 'Most screen fights happen at the ending. Say the plan before it starts (“one episode, then the timer, then we build the fort”), give a two-minute warning, and have the next thing ready. Watching together is the one habit that reads positive in the research.', c: D('screen-plan') + L('screen') + M };
  if (/(tantrum|meltdown|scream|yell|mad|angry|hit|kick|throw|rage)/.test(t)) return { t: 'At the peak, fewer words: keep everyone safe, stay close, name it once (“You’re really mad. I’m here.”). Four slow breaths with a picture to follow works better than “calm down”. The moment it passes, notice the calm out loud. That is the part that changes next time.', c: M + D('calm-tantrums') + L('breathe') };
  if (/(other home|dad|mom|marc|ex|handover|hand-over|pick ?up|drop ?off|two homes|separat|divorc)/.test(t)) return { t: 'What predicts how a child does after a separation is the level of conflict, not the two homes. One shared rule at a time, said in the same words in both houses. Propose it in Plan › Rules; ' + ON() + ' gets it to accept.', c: `<button class="chip act" onclick="go('plan',{planTab:'rules'})">Plan › Rules ›</button>` + L('two') };
  if (/(idea|bored|play|game|rain|wait|car|restaurant|nothing to do)/.test(t)) { const picks = QUICK.filter(x => k.age >= x[1] && k.age <= x[2]).slice(0, 3); return { t: 'Three screen-free things for ' + k.name + ', ' + k.age + ':<br>' + picks.map(p => `<b>${p[0]}</b>: ${p[3]}`).join('<br>'), c: `<button class="chip act" onclick="go('toolkit')">All ideas ›</button>` }; }
  if (/(talk|language|words|speak|story|question)/.test(t)) return { t: 'Back-and-forth beats word count. One question back, then wait. In 36 children, the number of conversational turns predicted language-area activity, independently of how many words they heard.', c: D('responsive-connection') + L('talk') };
  return { t: 'Tell me what is happening with ' + k.name + ' in one sentence, and I will give you the words, one thing to try, and the study behind it. If it is happening right now, use the button below.', c: M };
}
let paalBusy=false;
function serverMarkup(a){const src=new Map((a.sources||[]).map(x=>[x.id,x]));const link=id=>{const x=src.get(id);return x&&/^https:\/\//.test(x.url)?`<a class="chip act" href="${x.url}" target="_blank" rel="noopener noreferrer">${x.title.replace(/[<>]/g,'')} ↗</a>`:''};
 const e=t=>String(t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
 let t=e(a.reassurance);if(a.parent_words)t+=`<br><br><b>You could say:</b> “${e(a.parent_words.text)}”`;if(a.actions&&a.actions.length)t+='<br><br>'+a.actions.map((x,i)=>`${i+1}. ${e(x.text)}`).join('<br>');if(a.why)t+=`<br><br>${e(a.why.text)}`;if(a.question)t+=`<br><br>${e(a.question)}`;
 return {t,c:(a.citations||[]).map(link).join('')}}
async function askServer(v){if(location.protocol==='file:')return null;try{const k=kid();const r=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v.slice(0,2000),age_months:Math.round(k.age*12)}),signal:AbortSignal.timeout(12000),cache:'no-store'});
 if(!r.ok)return null;const a=await r.json();if(['answer','clarify','safety'].includes(a.status))return serverMarkup(a);return null}catch(e){return null}}
async function paalSend(q){const v=q||val('chatq');if(!v||paalBusy)return;paalBusy=true;S.chat=S.chat||[];S.chat.push({me:1,t:v});S.chat.push({t:'<span style="letter-spacing:3px;font-weight:800;color:var(--violet)">• • •</span>',typing:1});save();render();
 const srv=await askServer(v);const a=srv||paalAnswer(v);S.chat.pop();S.chat.push({t:a.t,c:a.c,from:srv?'server':'local'});paalBusy=false;save();if(S.screen==='paal')render();const e=document.getElementById('chat-end');if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'end'})}
V.paal = () => {
  const k = kid(), chat = S.chat || [];
  const chips = ['Bedtime is a fight', k.name + ' won’t stop the tablet', 'A screen-free idea', 'I’m at my limit'].map(c => `<button class="chip" onclick="paalSend('${c.replace(/'/g, '\\\'')}')">${c}</button>`).join('');
  const msgs = chat.map(m => m.me ? `<div style="align-self:flex-end;max-width:85%;background:var(--violet);color:#fff;border-radius:22px 22px 6px 22px;padding:14px 18px;line-height:1.5">${m.t}</div>` : `<div style="display:flex;gap:10px;align-items:flex-start;max-width:92%">${mon('ghost', 30)}<div class="stack" style="gap:10px"><div style="background:#fff;border-radius:6px 22px 22px 22px;padding:16px 18px;line-height:1.55">${m.t}</div>${m.c ? `<div class="btnrow">${m.c}</div>` : ''}</div></div>`).join('');
  return `<div class="fade stack" style="gap:36px">${H('PAAL', 'Ask anything.')}
<button onclick="go('m1')" style="background:var(--violet);color:#fff;border:0;border-radius:36px;padding:26px 28px;display:flex;gap:18px;align-items:center;text-align:left;width:100%">${mon('ghost', 56)}<div class="grow"><div style="font-size:20px;font-weight:600;letter-spacing:-.4px">Something’s happening with ${k.name}?</div><div style="font-size:14px;opacity:.85;margin-top:4px">Right now: one thing to say, one thing to try.</div></div><span style="width:42px;height:42px;border-radius:50%;background:#fff;color:var(--violet);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none">→</span></button>
<button class="item btnlike" style="background:var(--grad)" onclick="go('reset')">${mon('sleepy', 48)}<div class="grow"><div style="font-size:17px;font-weight:600">Parent reset · 4 minutes</div></div><span class="mute">›</span></button>
${SEC('Ask paal', `<div class="stack" style="gap:14px">${msgs}<div id="chat-end"></div></div>${chat.length?'':`<div class="sugg">${chips}</div>`}<div style="display:flex;gap:8px">${micBtn('chatq')}<input type="text" id="chatq" aria-label="Your question" placeholder="Type or speak" onkeydown="if(event.key==='Enter')paalSend()"><button class="btn v" style="height:54px;padding:0 22px" onclick="paalSend()">Send</button></div>`)}</div>`;
};
let rt = null, ra = null; function clearReset() { if (rt) { clearInterval(rt); rt = null; } if (ra) { try { ra.pause(); } catch (e) {} ra = null; } }
function playReset(i) { if (location.protocol === 'file:') return; try { ra = new Audio('audio/parent-reset/' + (i + 1) + '.m4a'); ra.play().catch(() => {}); } catch (e) {} }
V.reset = () => {
  clearReset(); const i = S.ri || 0, st = RESET_STEPS[i]; if (!st) return V.paal();
  setTimeout(() => { playReset(i); let n = 0; const bar = document.getElementById('rbar'); rt = setInterval(() => { n++; if (bar) bar.style.width = Math.min(100, n / st[1] * 100) + '%'; if (n >= st[1]) { clearReset(); if (i + 1 < RESET_STEPS.length) set({ ri: i + 1 }); else { S.ri = 0; save(); go('paal'); toast('Four minutes, done. Well done.'); } } }, 1000); }, 50);
  return `<div class="fade stack" style="gap:28px;max-width:520px;margin:0 auto;width:100%;text-align:center;padding-top:20px"><div class="small">Parent reset · ${i + 1} of ${RESET_STEPS.length}</div><div style="display:flex;justify-content:center">${mon('sleepy', 110, 'class="bob"')}</div><h1 class="t1" style="font-size:36px">${st[0]}</h1><p style="font-size:19px;line-height:1.6">${st[2]}</p><div style="height:10px;border-radius:5px;background:#E4DCF5;overflow:hidden"><div id="rbar" style="height:100%;width:0;background:var(--violet);transition:width 1s linear"></div></div>
  <div class="btnrow" style="justify-content:center">${i + 1 < RESET_STEPS.length ? BTN('Next step', `set({ri:${i + 1}})`, 'soft2 sm') : ''}${BTN('Stop', "clearReset();S.ri=0;save();go('paal')", 'ghost sm')}</div></div>`;
};

/* ---------- 3. Family › Handoff (what the next home needs to know) ---------- */
function handoffBody() {
  const k = kid(), ups = (S.updates || []).filter(u => u.child === k.id), who = custodyFor(TODAY), nextHome = who === S.me || who === 'both' ? ON() : cg(S.me).name;
  const kinds = ['What helped', 'Heads-up', 'Handoff note'];
  return `
  <div class="soft stack"><div class="btnrow">${kinds.map(x => `<button class="chip ${(S.upKind || 'What helped') === x ? 'on' : ''}" onclick="set({upKind:'${x}'})">${x}</button>`).join('')}</div><textarea id="uptext" rows="3" placeholder="${(S.upKind || 'What helped') === 'What helped' ? 'Water play at the sink, 10 calm minutes.' : 'Short night, he may be tired by 5 pm.'}"></textarea><div class="btnrow">${BTN('Send to ' + nextHome, 'postUpdate()', 'sm')}</div></div>
  <div class="stack">${ups.slice().reverse().map(u => `<div class="item">${mon(cg(u.by).mon, 40)}<div class="grow"><div class="small" style="color:#6B55C9;font-weight:600">${u.kind} · ${cg(u.by).name}</div><div style="font-weight:500;line-height:1.45">${u.t}</div><div class="small">${u.when}</div></div></div>`).join('') || '<p class="small">No note yet.</p>'}</div>`;
}
function postUpdate() { const t = val('uptext'); if (!t) { toast('Write one line first'); return; } S.updates = S.updates || []; S.updates.push({ child: kid().id, by: S.me, kind: S.upKind || 'What helped', t, when: 'Today · ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) }); if ((S.upKind || 'What helped') === 'What helped' && !kid().works.some(w => w[0] === t)) kid().works.unshift([t, 'Noted by ' + cg(S.me).name]); save(); render(); toast('Sent. The other home sees it now.'); }

 let sc=S.onboarded?S.screen:(['welcome','onb1','onb2','onb3'].includes(S.screen)?S.screen:'welcome');

 if(isCarer()&&['today','plan','family','learn','village','paal'].includes(sc)){sc='carer';S.tab='today'}

 if(sc==='m4'&&!S.from)S.from='m3';document.getElementById('app').innerHTML=(V[sc]||V.today)();
 const show=S.onboarded&&!['m2','sitter','auth'].includes(sc);
 const tabs=TABSET.map(([k,v])=>{const on=S.tab===k||(k==='toolkit'&&sc==='toolkit');const ic=ICONS[k]||ICONS.learn;return `<button class="tabbtn ${on?'on':''}" ${on?'aria-current="page"':''} onclick="go('${k}')"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">${ic[on?1:0]}</svg><span class="lbl">${v}</span></button>`}).join('');

 side.style.display=show?'':'none';m.style.display=show?'':'none';
 side.innerHTML=show?`<button class="logo" onclick="go('today')">${mon('ghost',34)}paal</button>${tabs}<div style="margin-top:auto" class="stack"><div style="padding:12px;border-radius:18px;background:var(--lav2)"><div class="label" style="margin-bottom:8px">View as</div><div style="display:flex;gap:5px">${['claire','marc','nana'].map(id=>`<button class="chip ${S.me===id?'on':''}" style="flex:1;min-width:0;justify-content:center;padding:8px 4px;font-size:12.5px;overflow:hidden" onclick="viewAs('${id}')">${cg(id).name}</button>`).join('')}</div></div><button class="tabbtn" onclick="if(confirm_reset())return" style="font-size:12px;color:#9B94A6">Reset demo</button>${S.account?`<button class="tabbtn" onclick="signOut()" style="font-size:12px;color:#9B94A6">Sign out · ${S.account}</button>`:''}</div>`:'';
 m.innerHTML=show?tabs:'';
 let va=document.getElementById('va-m');if(!va){va=document.createElement('div');va.id='va-m';document.body.appendChild(va)}
 const nxt={claire:'marc',marc:'nana',nana:'claire',sam:'claire'}[S.me]||'claire';
 va.innerHTML=show?`<button onclick="viewAs('${nxt}')" aria-label="Viewing as ${cg(S.me).name}. Switch to ${cg(nxt).name}">${mon(cg(S.me).mon,26)}<span>${cg(S.me).name}</span></button>`:'';
 if(!show&&sc!=='sitter')document.getElementById('main').style.paddingTop='36px';else document.getElementById('main').style.paddingTop='';
}
